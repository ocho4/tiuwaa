<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIU Virtual – Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .container {
      position: relative;
      width: 100vw;
      max-width: 430px;
      aspect-ratio: 430/932;
      background: url('Generated Image November 07, 2025 - 9_30AM.png') no-repeat center center;
      background-size: cover;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .overlay {
      position: absolute;
      top: 23.4%;
      width: 100%;
      text-align: center;
      color: #000;
    }

    .clock {
      font-size: 2.2rem;
      color: #1b1b21;
      font-weight: 8600;
      margin-bottom: 0.1rem;
    }

    .profile-picture {
    position: absolute;
    top: 48.6%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    /*/box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    border: 4px solid #fff;/*/
    background: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    }


    .profile-picture img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    }

    .name {
      font-family: 'Oswald', sans-serif;
      position: absolute;
      bottom: 27%;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      color: #e63946;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="overlay">
      <div id="clock" class="clock">--:--:--</div>
    </div>

    <div class="profile-picture">
    <img src="carnet.jpg" alt="Foto de perfil" />
    </div>

    <div class="name">Marisa Valery Gil Ayala</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const opts = { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-ES', opts).replace(',', '');
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
