<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TIU Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #f7f9fd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    .app-screen {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100dvh;
      max-height: 932px;
      background: #f7f9fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 14px) 16px 0 16px;
      overflow: hidden;
    }

    /* =========================================
       NUBES VECTORIALES RÁPIDAS
       ========================================= */
    .clouds-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      fill: #b9c1eb;
      will-change: transform;
    }

    @keyframes moveLeft {
      0% {
        transform: translate3d(450px, 0, 0);
      }
      100% {
        transform: translate3d(-130px, 0, 0);
      }
    }

    .cloud-1 {
      top: 36%;
      width: 68px;
      opacity: 0.85;
      animation: moveLeft 5.4s linear infinite;
      animation-delay: -1.2s;
    }

    .cloud-2 {
      top: 42%;
      width: 86px;
      opacity: 0.65;
      animation: moveLeft 7.0s linear infinite;
      animation-delay: -4s;
    }

    .cloud-3 {
      top: 34%;
      width: 46px;
      opacity: 0.9;
      animation: moveLeft 4.5s linear infinite;
      animation-delay: -2.3s;
    }

    .cloud-4 {
      top: 48%;
      width: 62px;
      opacity: 0.75;
      animation: moveLeft 5.9s linear infinite;
      animation-delay: -3.5s;
    }

    .cloud-5 {
      top: 51%;
      width: 40px;
      opacity: 0.55;
      animation: moveLeft 7.5s linear infinite;
      animation-delay: -0.6s;
    }

    /* =========================================
       HEADER
       ========================================= */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 24px;
      padding-left: 6px;
      z-index: 2;
    }

    .back-btn {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: none;
      cursor: pointer;
      margin-right: 22px;
    }

    .back-btn svg {
      width: 15px;
      height: 15px;
      fill: #ff383c;
    }

    .title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.15rem;
      font-weight: 500;
      color: #111418;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* =========================================
       PASTILLA DE HORA Y FECHA
       ========================================= */
    .clock-pill {
      background: #dfdffc;
      border-radius: 12px;
      width: 230px;
      height: 54px;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .clock {
      font-size: 2.1rem;
      color: #111111;
      font-weight: 400;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .date {
      font-size: 0.94rem;
      color: #5c6270;
      font-weight: 400;
      text-align: center;
      margin-bottom: 32px;
      z-index: 2;
    }

    /* =========================================
       FOTO DE PERFIL (CENTRO VERTICAL)
       ========================================= */
    .profile-picture {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      overflow: hidden;
      background: #e2e5eb;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      margin-bottom: 42px; /* SEPARACIÓN AMPLIA HACIA LA TARJETA BLANCA */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .profile-picture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================
       TARJETA BLANCA ALARGADA
       ========================================= */
    .card {
      background: #ffffff;
      border-radius: 14px 14px 0 0;
      width: 100%;
      flex: 1;
      box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.03);
      text-align: center;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 36px 16px;
    }

    .name {
      font-family: 'Oswald', sans-serif;
      font-size: 1.95rem;
      font-weight: 500;
      color: #ff383c;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: 0.3px;
    }

    .masked-lastname {
      font-family: 'Oswald', sans-serif;
      font-size: 1.85rem;
      font-weight: 500;
      color: #ff383c;
      letter-spacing: 2px;
      line-height: 1.05;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 0.76rem;
      color: #5d6371;
      font-weight: 400;
      margin-top: 8px;
    }

    .field-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #42526a;
      margin-top: 2px;
      letter-spacing: 0.4px;
    }

    .career {
      font-size: 1.02rem;
      font-weight: 700;
      color: #42526a;
      margin-top: 18px;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .campus {
      font-size: 0.88rem;
      color: #2b303a;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="app-screen">

    <div class="clouds-layer">
      <svg class="cloud cloud-1" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-2" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-3" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-4" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-5" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
    </div>

    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="title">TIU Virtual</div>
    </div>

    <!-- Pastilla de hora -->
    <div class="clock-pill">
      <div id="clock" class="clock">--:--:--</div>
    </div>

    <!-- Fecha -->
    <div id="date" class="date">--</div>

    <!-- Foto centrada en el cielo -->
    <div class="profile-picture">
      <img src="./carnet.jpg" alt="Foto de perfil" />
    </div>

    <!-- Tarjeta blanca separada -->
    <div class="card">
      <div class="name">Marisa Valery</div>
      <div class="masked-lastname">G*** A***</div>

      <div class="field-label">Código de alumno:</div>
      <div class="field-value">U202318269</div>

      <div class="field-label">ID Banner:</div>
      <div class="field-value">N04042635</div>

      <div class="career">ING. SISTEMAS DE INFORMACIÓN</div>

      <div class="campus">
        <span>📍</span> Campus Villa
      </div>
    </div>

  </div>

  <script>
    const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Set', 'Oct', 'Nov', 'Dic'];

    function updateClock() {
      const now = new Date();
      
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const diaSemana = DIAS[now.getDay()];
      const diaNum = now.getDate();
      const mes = MESES[now.getMonth()];
      const anio = now.getFullYear();

      document.getElementById('date').textContent = `${diaSemana}, ${diaNum} ${mes} ${anio}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
