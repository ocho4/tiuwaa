<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TIU Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #f7f9fd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    .app-screen {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100dvh; /* Altura dinámica exacta para Safari iOS */
      max-height: 932px;
      background: #f7f9fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 24px) 18px env(safe-area-inset-bottom, 20px) 18px;
      overflow: hidden;
    }

    /* =========================================
       NUBES VECTORIALES RÁPIDAS (Carriles exactos)
       ========================================= */
    .clouds-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      fill: #b9c1eb;
      will-change: transform;
    }

    @keyframes moveLeft {
      0% {
        transform: translate3d(450px, 0, 0);
      }
      100% {
        transform: translate3d(-130px, 0, 0);
      }
    }

    .cloud-1 {
      top: 38%;
      width: 68px;
      opacity: 0.85;
      animation: moveLeft 5.4s linear infinite;
      animation-delay: -1.2s;
    }

    .cloud-2 {
      top: 42%;
      width: 86px;
      opacity: 0.65;
      animation: moveLeft 7.0s linear infinite;
      animation-delay: -4s;
    }

    .cloud-3 {
      top: 36%;
      width: 46px;
      opacity: 0.9;
      animation: moveLeft 4.5s linear infinite;
      animation-delay: -2.3s;
    }

    .cloud-4 {
      top: 47%;
      width: 62px;
      opacity: 0.75;
      animation: moveLeft 5.9s linear infinite;
      animation-delay: -3.5s;
    }

    .cloud-5 {
      top: 50%;
      width: 40px;
      opacity: 0.55;
      animation: moveLeft 7.5s linear infinite;
      animation-delay: -0.6s;
    }

    /* =========================================
       SECCIÓN SUPERIOR: HEADER, RELOJ, FECHA
       ========================================= */
    .top-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      margin-top: 6px;
    }

    .header {
      width: 100%;
      display: flex;
      align-items: center;
      margin-bottom: 22px;
      padding-left: 2px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: none;
      cursor: pointer;
      margin-right: 14px;
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
      fill: #eb2d3a;
    }

    .title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: #111418;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Cápsula lila */
    .clock-pill {
      background: #dfdffc;
      border-radius: 14px;
      padding: 10px 48px;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock {
      font-size: 2.35rem;
      color: #111111;
      font-weight: 400;
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .date {
      font-size: 0.95rem;
      color: #5c6270;
      font-weight: 500;
      text-align: center;
    }

    /* =========================================
       SECCIÓN INFERIOR: FOTO Y TARJETA BLANCA
       ========================================= */
    .bottom-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      margin-bottom: 8px;
    }

    .profile-picture {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      overflow: hidden;
      background: #e2e5eb;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      margin-bottom: -32px; /* Montada justo encima de la tarjeta */
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .profile-picture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      padding: 44px 16px 24px 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
      text-align: center;
      z-index: 2;
    }

    .name {
      font-family: 'Oswald', sans-serif;
      font-size: 2.15rem;
      font-weight: 500;
      color: #eb2d3a;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: 0.3px;
    }

    .masked-lastname {
      font-family: 'Oswald', sans-serif;
      font-size: 2.05rem;
      font-weight: 500;
      color: #eb2d3a;
      letter-spacing: 2px;
      line-height: 1.05;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 0.76rem;
      color: #5d6371;
      font-weight: 500;
      margin-top: 8px;
    }

    .field-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1a2f55;
      margin-top: 1px;
      letter-spacing: 0.4px;
    }

    .career {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1a2f55;
      margin-top: 18px;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .campus {
      font-size: 0.88rem;
      color: #2b303a;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="app-screen">

    <!-- Nubes animadas SVG en loop rápido -->
    <div class="clouds-layer">
      <svg class="cloud cloud-1" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-2" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-3" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-4" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-5" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
    </div>

    <!-- Parte Superior: Header, Cápsula y Fecha -->
    <div class="top-section">
      <div class="header">
        <button class="back-btn" onclick="history.back()">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="title">TIU Virtual</div>
      </div>

      <div class="clock-pill">
        <div id="clock" class="clock">--:--:--</div>
      </div>

      <div id="date" class="date">--</div>
    </div>

    <!-- Parte Inferior: Avatar + Tarjeta de Información -->
    <div class="bottom-section">
      <div class="profile-picture">
        <img src="./carnet.jpg" alt="Foto de perfil" />
      </div>

      <div class="card">
        <div class="name">Marisa Valery</div>
        <div class="masked-lastname">G*** A***</div>

        <div class="field-label">Código de alumno:</div>
        <div class="field-value">U202318269</div>

        <div class="field-label">ID Banner:</div>
        <div class="field-value">N04042635</div>

        <div class="career">ING. SISTEMAS DE INFORMACIÓN</div>

        <div class="campus">
          <span>📍</span> Campus Villa
        </div>
      </div>
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const opts = { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' };
      let rawDate = now.toLocaleDateString('es-ES', opts).replace(',', '');
      
      const formattedDate = rawDate.split(' ').map(word => {
        if (word.length > 2) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        }
        return word;
      }).join(' ');

      document.getElementById('date').textContent = formattedDate;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
