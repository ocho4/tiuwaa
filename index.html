<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TIU Virtual – Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    /* Contenedor base */
    .container {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      aspect-ratio: 430 / 932;
      background: url('fondo_tiu.png') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    /* =========================================
       NUBES ANIMADAS (Pasan detrás de la foto)
       ========================================= */
    .clouds-band {
      position: absolute;
      top: 36%;
      left: 0;
      width: 100%;
      height: 22%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1; /* Detrás de la foto */
    }

    .cloud {
      position: absolute;
      fill: #b8c0eb;
      will-change: transform;
    }

    @keyframes moveLeft {
      0% {
        transform: translate3d(450px, 0, 0);
      }
      100% {
        transform: translate3d(-120px, 0, 0);
      }
    }

    .cloud-1 {
      top: 15%;
      width: 65px;
      opacity: 0.8;
      animation: moveLeft 5.5s linear infinite;
      animation-delay: -1.2s;
    }

    .cloud-2 {
      top: 32%;
      width: 85px;
      opacity: 0.65;
      animation: moveLeft 7.2s linear infinite;
      animation-delay: -4s;
    }

    .cloud-3 {
      top: 12%;
      width: 48px;
      opacity: 0.9;
      animation: moveLeft 4.6s linear infinite;
      animation-delay: -2.5s;
    }

    .cloud-4 {
      top: 62%;
      width: 60px;
      opacity: 0.7;
      animation: moveLeft 6.0s linear infinite;
      animation-delay: -3.8s;
    }

    .cloud-5 {
      top: 72%;
      width: 40px;
      opacity: 0.55;
      animation: moveLeft 7.8s linear infinite;
      animation-delay: -0.8s;
    }

    /* =========================================
       FOTO DE PERFIL CIRCULAR (carnet.jpg)
       ========================================= */
    .profile-picture {
      position: absolute;
      top: 41.2%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 148px;
      height: 148px;
      border-radius: 50%;
      overflow: hidden;
      background: #f7f9fd;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3; /* Encima de las nubes y del fondo */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .profile-picture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================
       RELOJ, FECHA Y DATOS DINÁMICOS
       ========================================= */
    .clock {
      position: absolute;
      top: 14.8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.35rem;
      color: #111111;
      font-weight: 500;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      z-index: 2;
      text-align: center;
      width: 100%;
    }

    .date {
      position: absolute;
      top: 24.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95rem;
      color: #5c6270;
      font-weight: 500;
      text-align: center;
      width: 100%;
      z-index: 2;
    }

    .name-container {
      position: absolute;
      top: 61.8%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 2;
    }

    .name {
      font-family: 'Oswald', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: #e63946;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 0.4px;
    }

    .masked-lastname {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #e63946;
      letter-spacing: 2.5px;
      line-height: 1.1;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Capa de nubes detrás de la foto -->
    <div class="clouds-band">
      <svg class="cloud cloud-1" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-2" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-3" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-4" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
      <svg class="cloud cloud-5" viewBox="0 0 74 34">
        <path d="M57 34H6a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6a7.8 7.8 0 0 1 2.2.3C10.5 12.3 19.3 5 30 5c9.2 0 17 5.4 19.8 13.1A9.9 9.9 0 0 1 57 16a10 10 0 0 1 10 10c0 4.4-3.6 8-10 8z"/>
      </svg>
    </div>

    <!-- Foto original de carnet.jpg sobrepuesta -->
    <div class="profile-picture">
      <img src="./carnet.jpg" alt="Foto de perfil" />
    </div>

    <!-- Reloj -->
    <div id="clock" class="clock">--:--:--</div>

    <!-- Fecha -->
    <div id="date" class="date">--</div>

    <!-- Nombre y apellido -->
    <div class="name-container">
      <div class="name">Marisa Valery</div>
      <div class="masked-lastname">G*** A***</div>
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const opts = { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' };
      let rawDate = now.toLocaleDateString('es-ES', opts).replace(',', '');
      
      const formattedDate = rawDate.split(' ').map(word => {
        if (word.length > 2) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        }
        return word;
      }).join(' ');

      document.getElementById('date').textContent = formattedDate;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
